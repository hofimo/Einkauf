# Fallback, falls sich Einkauf.xcodeproj nicht öffnen lässt:
#   brew install xcodegen && xcodegen
name: Einkauf
options:
  bundleIdPrefix: de.hoffi
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
targets:
  Einkauf:
    type: application
    platform: iOS
    sources: [Einkauf]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Einkauf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: de.hoffi.Einkauf
            CFBundleURLSchemes: [einkauf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.hoffi.Einkauf
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
